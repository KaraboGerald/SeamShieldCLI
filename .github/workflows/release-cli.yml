name: Release Community CLI

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact packages/cli package version to release"
        required: true
        type: string
      publish:
        description: "Publish to npm through trusted publishing (false runs verification only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.6.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${{ inputs.version }}" = "$version"
          else
            test "${GITHUB_REF_NAME#cli-v}" = "$version"
          fi
      - run: pnpm release:verify
      - name: Publish with npm Trusted Publishing
        if: github.event_name == 'push' || inputs.publish == true
        working-directory: packages/cli
        run: npm publish --access public
